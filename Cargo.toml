[package]
name = "vaultwarden-backup"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
description = "Backup a vaultwarden data directory to a timestamped .tgz (SQLite online backup + file tar)"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
object_store = { version = "0.14", default-features = false, features = ["aws"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tar = "0.4"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "fs"] }

[dev-dependencies]
# Integration tests are a separate crate: they link the library plus these,
# so the S3 e2e helpers (object_store client, tokio runtime, time stamps)
# must be declared here as well.
object_store = { version = "0.14", default-features = false, features = ["aws"] }
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints.rust]
# Warnings are errors everywhere; set here (not a `-- -D warnings` flag) so
# build, clippy and the hooks share one policy.
warnings = "deny"

[lints.clippy]
# clippy lints have their own namespace, so this is in addition to the
# `warnings` group above.
all = "deny"
# No unwrap/expect in production code; test builds opt out in src/lib.rs
# (cfg_attr(test, allow(..))) and tests/integration.rs.
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
strip = true
