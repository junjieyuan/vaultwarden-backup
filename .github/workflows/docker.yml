name: Docker

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # ghcr.io push via the default GITHUB_TOKEN.
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Checkout defaults to depth-1, which would make the master-ancestry
          # check below impossible; fetch the full history once.
          fetch-depth: 0

      # Docker tags only fire on version tag pushes. Tags can sit on any
      # commit and tag events carry no branch info, so refuse anything not
      # reachable from master up front — mirrors the release gate.
      - name: Require tag to point into master
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master \
            || { echo "tag ${GITHUB_REF#refs/tags/} does not point into master"; exit 1; }

      # amd64 natively, arm64 under QEMU.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest tracks the most recent stable release; v1.2.3 -> 1.2.3, 1.2,
      # 1, latest. Prerelease tags (v1.2.3-rc.1) contain a dash, so the
      # latest/major/minor tags are disabled for them to avoid overwriting
      # stable tags.
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max