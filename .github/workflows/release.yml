name: Release

on:
  push:
    tags:
      # Exact semantic-version tags only: v1.2.3 and v1.2.3-rc.1 style
      # (GitHub tag filters are globs, where "+" means "one or more").
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  # A force-pushed or re-created tag would otherwise race a second run
  # mid-upload; serializing per tag prevents that.
  group: release-${{ github.ref_name }}

permissions:
  # CI runs read-only; releases need write for softprops (create/publish)
  # and taiki-e (asset upload) through the default github.token.
  contents: write

jobs:
  gate-and-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Checkout defaults to depth-1, which would make the master-ancestry
          # check below impossible; fetch the full history once.
          fetch-depth: 0
      - name: Require tag to point into master
        run: |
          # Tags can sit on any commit and tag events carry no branch info,
          # so refuse anything not reachable from master up front.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master \
            || { echo "tag ${GITHUB_REF#refs/tags/} does not point into master"; exit 1; }
      # Manifest version and tag are set independently; a mismatch would
      # publish the binary under the wrong version number, so pin them.
      - name: Check tag matches Cargo.toml version
        run: |
          tag_version=${GITHUB_REF#refs/tags/v}
          cargo_version=$(awk -F'"' '/^version = / {print $2; exit}' Cargo.toml)
          test "$tag_version" = "$cargo_version" \
            && echo "OK: v$tag_version matches Cargo.toml" \
            || { echo "tag v$tag_version != Cargo.toml $cargo_version"; exit 1; }
      # Owner CI already ran fmt/clippy/test on this exact commit (commits are
      # immutable), so nothing is re-run here; draft straight away.
      # Draft first (with generated notes) so the parallel upload job below
      # only ever appends assets to an existing release instead of racing to
      # create it (taiki-e's upload action expects the release to exist).
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true

  build-and-upload:
    needs: gate-and-draft
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      # taiki-e installs the rust target and, for cross-targets, the matching
      # cross C toolchain; needed because rusqlite compiles bundled SQLite C
      # code. --locked keeps release builds on the committed Cargo.lock.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: vaultwarden-backup
          target: ${{ matrix.target }}
          checksum: sha256
          locked: true

  publish:
    needs: [gate-and-draft, build-and-upload]
    runs-on: ubuntu-latest
    steps:
      # No checkout: softprops talks to the API directly. Only finalize once
      # every platform uploaded, so a failing build never publishes a partial
      # release; no body input keeps the notes generated by gate-and-draft.
      - uses: softprops/action-gh-release@v3
        with:
          draft: false